name: Public repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata and policy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile public Python tools
        run: python3 -m compileall -q configure.py tools
      - name: Verify generated progress and repository policy
        run: make public-check
